name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPLOAD_PASSWORD: ${{ secrets.LIFEDESK_UPLOAD_PASSWORD }}
      # Accounts & cloud backup (Firebase). Optional: without them the app runs offline-only.
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeDesk-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Google Play build. The upload key is committed only in encrypted form (app/upload-keystore.jks.enc);
      # add the repository secret LIFEDESK_UPLOAD_PASSWORD to unlock it. Without the secret this step is skipped.
      - name: Build signed Play Store bundle (AAB) and release APK
        if: ${{ env.UPLOAD_PASSWORD != '' }}
        env:
          UPLOAD_PASSWORD: ${{ secrets.LIFEDESK_UPLOAD_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/upload-keystore.jks.enc \
            -out "$RUNNER_TEMP/upload.jks" -pass env:UPLOAD_PASSWORD
          export LIFEDESK_KEYSTORE="$RUNNER_TEMP/upload.jks" LIFEDESK_KEY_ALIAS=upload
          export LIFEDESK_KEYSTORE_PASSWORD="$UPLOAD_PASSWORD" LIFEDESK_KEY_PASSWORD="$UPLOAD_PASSWORD"
          ./gradlew bundleRelease assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Play Store files
        if: ${{ hashFiles('app/build/outputs/bundle/release/*.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LifeDesk-play-store
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      # Every push to main publishes/updates the GitHub Release "v<versionName>" (from app/build.gradle.kts).
      # Bump versionName to cut a new release; pushing a v* tag works too.
      - name: Work out release version
        id: version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release files
        if: steps.version.outputs.tag != ''
        run: |
          mkdir -p dist
          # Stable name so https://github.com/<owner>/<repo>/releases/latest/download/LifeDesk.apk always works.
          cp app/build/outputs/apk/debug/app-debug.apk dist/LifeDesk.apk
          if ls app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then
            cp app/build/outputs/bundle/release/*.aab dist/LifeDesk-playstore.aab
            cp app/build/outputs/apk/release/*.apk dist/LifeDesk-release.apk
          fi

      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LifeDesk ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            dist/*.apk
            dist/*.aab
          body: |
            **LifeDesk** — everything in your life that has a date, payment or deadline.

            ### Install on Android
            1. Download **LifeDesk.apk** below on your phone.
            2. Open it. If asked, allow your browser/file manager to "Install unknown apps".
            3. Tap **Install**, open LifeDesk, continue with your Google account and scan your first document.

            Requires Android 8.0 or newer. Documents are processed on your phone.

            **LifeDesk-playstore.aab** (when present) is the signed bundle to upload in Google Play Console.

name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeDesk-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Optional signed release: add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          LIFEDESK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LIFEDESK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LIFEDESK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          LIFEDESK_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LifeDesk-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare release files (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          # Stable name so https://github.com/<owner>/<repo>/releases/latest/download/LifeDesk.apk always works.
          cp app/build/outputs/apk/debug/app-debug.apk dist/LifeDesk.apk
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk dist/LifeDesk-signed.apk
          fi

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LifeDesk ${{ github.ref_name }}
          files: dist/*.apk
          body: |
            **LifeDesk** — everything in your life that has a date, payment or deadline.

            ### Install on Android
            1. Download **LifeDesk.apk** below on your phone.
            2. Open it. If asked, allow your browser/file manager to "Install unknown apps".
            3. Tap **Install**, open LifeDesk, and try **Explore with sample data** or scan your first document.

            Requires Android 8.0 or newer. All data stays on your phone.
